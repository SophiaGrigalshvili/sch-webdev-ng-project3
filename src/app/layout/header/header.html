<header>
  <nav>
    <a routerLink="/"><h2>Foodie</h2></a>
    <a
      class="dekstopView"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Home</a
    >
    <a class="dekstopView" routerLink="/menu" routerLinkActive="active">Menu</a>
  </nav>

  <div class="btnsDiv">
    <a class="btn" routerLink="/cart"> 🛒 </a>

    @if (isLoggedIn) {
      <a class="btn orangeBtn dekstopView userBtn" (click)="userBurger()">👤</a>
      <div class="userMenu desktopView" [class.active]="isUserBurgerOn()">
        <p>Hello: {{ userService.userData()?.firstName }}</p>
        <a class="btn userNavBtn" style="margin-bottom: 0px" routerLink="/profile">Profile</a>
        <button class="btn userNavBtn logOutBtn" (click)="authService.logout()">Log Out</button>
      </div>
    } @else {
      <a class="btn dekstopView" routerLink="/login">Login</a>
      <a class="btn orangeBtn dekstopView" routerLink="/register">Sign up</a>
    }
  </div>
</header>
